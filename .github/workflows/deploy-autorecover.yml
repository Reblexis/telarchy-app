name: Auto-recover the deploy

# The self-hosted runners (the popos laptops) sometimes receive a shutdown
# signal mid-test under heavy concurrent load, which fails the whole deploy
# even though nothing is actually broken: the failing log shows tests passing
# and then "The runner has received a shutdown signal" / "The operation was
# canceled", not a test assertion. That transient death used to leave main
# without a candidate until someone re-ran it by hand.
#
# So: when "Deploy backend to Cloud Run" ends in FAILURE, re-run its FAILED
# jobs (and the deploy job that depends on them), up to a small cap on the
# run's attempt count. A flaky runner then self-heals within a few minutes; a
# genuinely red suite still fails after the cap and surfaces normally, so this
# only outlasts a bad runner, it never hides a real failure. Owner ask
# 2026-08-22: "make it autorecover so it doesn't happen again."
#
# Why this cannot storm the runners: the deploy workflow runs one build at a
# time (concurrency cloud-run-deploy, cancel-in-progress:false), and a run that
# loses the concurrency race ends as 'cancelled', not 'failure', so it never
# triggers this. Only the single in-flight build that actually failed does, so
# there is at most one recovery chain live at once.

on:
  workflow_run:
    workflows: ["Deploy backend to Cloud Run"]
    types: [completed]

permissions:
  actions: write   # re-run workflow jobs

concurrency:
  # One recovery chain per deploy run; a run's id is stable across its attempts.
  group: deploy-autorecover-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  rerun:
    # Only failures, and only for the first few attempts. run_attempt is 1 on
    # the original run and increments on each re-run, so "< 5" allows up to
    # four automatic retries before a persistent failure is left red for a
    # human. A real test failure fails fast, so retrying it is cheap; a runner
    # death happens after minutes of work, which is exactly what we want to
    # ride out.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 5
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-run the failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Deploy run $RUN_ID failed on attempt $ATTEMPT; re-running its failed jobs."
          # Give a runner that just died a moment to come back before asking
          # for the same jobs again.
          sleep 30
          code=$(curl -sS -o /tmp/rerun.out -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/rerun-failed-jobs")
          echo "rerun-failed-jobs -> HTTP $code"
          cat /tmp/rerun.out || true
          # 201 Created = the re-run was queued. Anything else (e.g. the run is
          # too old to re-run, or a permissions problem) is a real error worth
          # failing on so it is visible rather than silently not recovering.
          [ "$code" = "201" ]
