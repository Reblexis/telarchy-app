name: Mobile shell

# The Android store shell (docs/mobile.md). The shell loads the live site, so
# a product change never needs this workflow; what it protects is the shell
# itself, which is easy to break without noticing because nothing in the web
# suite compiles Java.
#
# Two jobs. `android-debug` runs on every pull request that touches the shell
# and proves it still assembles. `android-release` is manual and produces the
# signed bundle a human uploads to Play; it no-ops without the signing
# secrets, so the workflow is inert until the Play account exists rather than
# failing red on every run until then.

on:
  pull_request:
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'src/lib/native-push.ts'
      - 'src/lib/mobile-address.ts'
      - '.github/workflows/mobile-shell.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Build a signed release bundle (needs the signing secrets)'
        type: boolean
        default: false

concurrency:
  group: mobile-shell-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-debug:
    name: Android shell builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --no-audit --no-fund
      # The web build is the offline fallback Capacitor copies in; the shell
      # itself loads the live origin.
      - run: npm run build
      - run: npx cap sync android
      # The scaffold's own launcher icon and splash must not have come back.
      # cap sync does not restore them, but a Capacitor upgrade in the same
      # PR would, and that is exactly the diff nobody reads.
      - run: npx vitest run src/__tests__/native-shell-icons.test.ts
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: telarchy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android-release:
    name: Android release bundle
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check the signing secrets exist
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "ready=${{ env.KEYSTORE != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.signing.outputs.ready != 'true'
        run: |
          echo "::notice::No ANDROID_KEYSTORE_BASE64 secret; nothing to sign yet."
          echo "Add the Play signing material before running this with release=true."
      - uses: actions/setup-node@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.signing.outputs.ready == 'true'
      - if: steps.signing.outputs.ready == 'true'
        run: npm ci --no-audit --no-fund
      - if: steps.signing.outputs.ready == 'true'
        run: npm run build && npx cap sync android
      - name: Restore the keystore and the Firebase config
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$KEYSTORE" | base64 -d > android/app/telarchy.keystore
          # Absent this the bundle still builds; push registration fails at
          # runtime and the mobile switch reports it (docs/mobile.md).
          if [ -n "$GOOGLE_SERVICES" ]; then
            echo "$GOOGLE_SERVICES" > android/app/google-services.json
          fi
      - if: steps.signing.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          name: telarchy-release-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
