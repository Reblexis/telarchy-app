name: Telarchy self-sync

# Hourly push of the dogfooding workspace's computed hero metrics ("Weekly
# active verified traders" and "Telarchy revenue (USD)") read from the public
# /api/marketplace/stats route. Governed by docs/metrics.md. Rebuilt
# 2026-08-14: the four-metric Firestore-era sync died in the Postgres
# migration and zombie-failed daily.

on:
  schedule:
    # Every hour at :40 (owner ask 2026-08-30, when revenue joined the sync:
    # a number the floor prices on three horizons must not be a day stale).
    # The :40 slot keeps the old settlement discipline, since the 23:40 run
    # still lands just inside the 00:00 UTC boundary that markets settle on.
    # The script writes only when a value changed, so an unchanged hour
    # leaves no row in the public metric log.
    - cron: '40 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: telarchy-self-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run self-sync
        env:
          TELARCHY_SELF_SYNC_KEY: ${{ secrets.TELARCHY_SELF_SYNC_KEY }}
          TELARCHY_SELF_SYNC_WORKSPACE: ${{ secrets.TELARCHY_SELF_SYNC_WORKSPACE }}
        run: node scripts/telarchy-self-sync.js
