<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Metrics Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="loading" id="loading">Loading...</div>

<div id="metricsContent" style="display: none;">
  <div class="header">
    <h1>Metrics Tracker</h1>
    <div class="header-actions">
      <select id="graphSensitivity" title="Graph sampling interval">
        <option value="second">1 Second</option>
        <option value="minute">1 Minute</option>
        <option value="hour">1 Hour</option>
        <option value="day" selected>1 Day</option>
        <option value="week">1 Week</option>
        <option value="month">1 Month</option>
        <option value="year">1 Year</option>
      </select>
      <button class="dark-mode-toggle" id="darkModeToggle" title="Toggle dark mode">🌙</button>
      <button class="reconfigure-btn" id="reconfigureBtn">⚙️ Reconfigure Firebase</button>
      <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
  </div>

  <div class="container">
    <div class="xp-display">
      <div class="xp-circle">
        <div class="xp-value" id="xpValue">0.00</div>
        <div class="xp-label">XP</div>
      </div>
      <div style="text-align: center; font-size: 1.25rem; font-weight: 600; color: #4a4a4a; margin-top: 0.5rem;">
        Rank: <span id="rankValue">-</span>
      </div>
    </div>

    <div class="section">
      <h2>Metrics Dashboard</h2>
      <div class="metrics-grid" id="metricsGrid"></div>
    </div>

    <div class="section">
      <h2>Add New Metric</h2>
      <form id="addMetricForm">
        <div class="form-group">
          <label for="metricName">Metric Name</label>
          <input type="text" id="metricName" required>
        </div>
        <div class="form-group">
          <label for="metricDescription">Description</label>
          <textarea id="metricDescription" placeholder="What does this metric represent?"></textarea>
        </div>
        <div class="form-group">
          <label for="metricValue">Base Value</label>
          <input type="number" id="metricValue" step="any" required>
        </div>
        <div class="form-group">
          <label for="metricFormula">Formula (optional)</label>
          <textarea id="metricFormula" placeholder="e.g., {Deep Work} + {Exercise} * 2">0</textarea>
        </div>
        <div class="form-group decay-row">
          <label for="metricDecay">Enable daily decay</label>
          <input type="checkbox" id="metricDecay">
        </div>
        <button type="submit" class="btn">Add Metric</button>
      </form>
    </div>

    <div class="section">
      <h2>Update History</h2>
      <div class="timeline" id="timeline"></div>
    </div>
  </div>
</div>

<div class="modal" id="editModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Edit Metric</h3>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <form id="editForm">
      <div class="form-group">
        <label for="editName">Name</label>
        <input type="text" id="editName" required>
      </div>
      <div class="form-group">
        <label for="editDescription">Description</label>
        <textarea id="editDescription" placeholder="What does this metric represent?"></textarea>
      </div>
      <div class="form-group">
        <label for="editValue">Base Value</label>
        <input type="number" id="editValue" step="any" required>
      </div>
      <div class="form-group">
        <label for="editFormula">Formula</label>
        <textarea id="editFormula" placeholder="e.g., {Deep Work} + {Exercise} * 2">0</textarea>
      </div>
      <div class="form-group decay-row">
        <label for="editDecay">Enable daily decay</label>
        <input type="checkbox" id="editDecay">
      </div>
      <div class="form-group">
        <label for="editUpdateNote">Update Note (optional)</label>
        <textarea id="editUpdateNote" placeholder="Describe what changed and why..."></textarea>
      </div>
      <button type="submit" class="btn">Save Changes</button>
    </form>
  </div>
</div>

<div class="modal" id="graphModal">
  <div class="modal-content modal-large">
    <div class="modal-header">
      <h3 id="graphModalTitle">Progress Graph</h3>
      <button class="modal-close" id="graphModalClose">&times;</button>
    </div>
    <div class="graph-modal-container" id="graphModalContainer">
      <canvas id="graphModalCanvas"></canvas>
    </div>
  </div>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
