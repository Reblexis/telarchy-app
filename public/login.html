<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - Metrics Tracker</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  line-height: 1.6;
  color: #1a1a1a;
  background: #ffffff;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
}

.container {
  max-width: 400px;
  width: 100%;
}

h1 {
  font-size: 2rem;
  font-weight: 600;
  margin-bottom: 2rem;
  letter-spacing: -0.02em;
}

.form-group {
  margin-bottom: 1.5rem;
}

label {
  display: block;
  margin-bottom: 0.5rem;
  font-weight: 500;
  color: #4a4a4a;
}

input {
  width: 100%;
  padding: 0.75rem;
  border: 2px solid #e0e0e0;
  border-radius: 4px;
  font-size: 1rem;
  font-family: inherit;
  transition: border-color 0.2s;
}

input:focus {
  outline: none;
  border-color: #1a1a1a;
}

button {
  width: 100%;
  padding: 0.75rem;
  background: #1a1a1a;
  color: white;
  border: none;
  border-radius: 4px;
  font-size: 1rem;
  font-weight: 500;
  cursor: pointer;
  transition: opacity 0.2s;
}

button:hover {
  opacity: 0.8;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.error {
  color: #d32f2f;
  font-size: 0.875rem;
  margin-top: 1rem;
  display: none;
}

.error.show {
  display: block;
}

.toggle-mode {
  margin-top: 1.5rem;
  text-align: center;
}

.toggle-mode button {
  background: none;
  color: #4a4a4a;
  text-decoration: underline;
  font-size: 0.875rem;
  padding: 0;
}

.toggle-mode button:hover {
  color: #1a1a1a;
  opacity: 1;
}

.reconfigure-link {
  margin-top: 1.5rem;
  text-align: center;
}

.reconfigure-link a {
  color: #999;
  text-decoration: none;
  font-size: 0.75rem;
}

.reconfigure-link a:hover {
  color: #1a1a1a;
}
</style>
</head>
<body>
<div class="container">
  <h1 id="pageTitle">Login</h1>
  <form id="authForm">
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" required>
    </div>
    <div class="form-group" id="confirmPasswordGroup" style="display: none;">
      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword">
    </div>
    <button type="submit" id="submitBtn">Login</button>
    <div class="error" id="errorMsg"></div>
  </form>
  <div class="toggle-mode">
    <button type="button" id="toggleBtn">Don't have an account? Sign up</button>
  </div>
  <div class="reconfigure-link">
    <a href="/setup.html">Reconfigure Firebase</a>
  </div>
</div>

<script type="module">
import { initializeFirebaseApp } from '/js/firebase-config.js';
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

let isSignUpMode = false;

const app = await initializeFirebaseApp();
const auth = getAuth(app);

const form = document.getElementById('authForm');
const errorMsg = document.getElementById('errorMsg');
const submitBtn = document.getElementById('submitBtn');
const toggleBtn = document.getElementById('toggleBtn');
const pageTitle = document.getElementById('pageTitle');
const confirmPasswordGroup = document.getElementById('confirmPasswordGroup');
const confirmPasswordInput = document.getElementById('confirmPassword');

toggleBtn.addEventListener('click', () => {
  isSignUpMode = !isSignUpMode;
  
  if (isSignUpMode) {
    pageTitle.textContent = 'Sign Up';
    submitBtn.textContent = 'Sign Up';
    toggleBtn.textContent = 'Already have an account? Login';
    confirmPasswordGroup.style.display = 'block';
    confirmPasswordInput.required = true;
  } else {
    pageTitle.textContent = 'Login';
    submitBtn.textContent = 'Login';
    toggleBtn.textContent = "Don't have an account? Sign up";
    confirmPasswordGroup.style.display = 'none';
    confirmPasswordInput.required = false;
  }
  
  errorMsg.classList.remove('show');
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const confirmPassword = confirmPasswordInput.value;
  
  errorMsg.classList.remove('show');
  submitBtn.disabled = true;
  submitBtn.textContent = isSignUpMode ? 'Signing up...' : 'Logging in...';
  
  try {
    if (isSignUpMode) {
      if (password !== confirmPassword) {
        throw new Error('Passwords do not match');
      }
      
      if (password.length < 6) {
        throw new Error('Password must be at least 6 characters');
      }
      
      await createUserWithEmailAndPassword(auth, email, password);
      window.location.href = '/metrics.html';
    } else {
      await signInWithEmailAndPassword(auth, email, password);
      window.location.href = '/metrics.html';
    }
  } catch (error) {
    let errorMessage = 'An error occurred';
    
    if (error.code === 'auth/email-already-in-use') {
      errorMessage = 'Email already in use';
    } else if (error.code === 'auth/invalid-email') {
      errorMessage = 'Invalid email address';
    } else if (error.code === 'auth/weak-password') {
      errorMessage = 'Password is too weak';
    } else if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
      errorMessage = 'Invalid email or password';
    } else if (error.message) {
      errorMessage = error.message;
    }
    
    errorMsg.textContent = errorMessage;
    errorMsg.classList.add('show');
    submitBtn.disabled = false;
    submitBtn.textContent = isSignUpMode ? 'Sign Up' : 'Login';
  }
});
</script>
</body>
</html>
