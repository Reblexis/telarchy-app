services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: telarchy
      POSTGRES_USER: telarchy
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telarchy"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://telarchy:${DB_PASSWORD:-changeme}@db:5432/telarchy
      API_KEY: ${API_KEY}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      # Required at boot (server.ts asserts a parseable key). A play-money
      # instance can use a throwaway EVM key; never reuse a funded wallet.
      TREASURY_PRIVATE_KEY: ${TREASURY_PRIVATE_KEY}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-*}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8080}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      ALLOW_LOCALHOST_CORS: ${ALLOW_LOCALHOST_CORS:-}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      PORT: 8080
    restart: unless-stopped

volumes:
  db_data:
